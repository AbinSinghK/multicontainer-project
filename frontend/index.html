<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🚀 Full Stack App</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      text-align: center;
      margin: 0;
      padding-top: 100px;
    }

    .container {
      background: rgba(0, 0, 0, 0.35);
      padding: 50px;
      border-radius: 20px;
      display: inline-block;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      backdrop-filter: blur(12px);
      animation: fadeIn 1s ease;
    }

    h1 {
      margin-bottom: 10px;
      font-weight: 600;
    }

    .subtitle {
      font-size: 14px;
      opacity: 0.8;
      margin-bottom: 25px;
    }

    button {
      padding: 14px 30px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(to right, #00c6ff, #0072ff);
      color: white;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }

    button:active {
      transform: scale(0.95);
    }

    #output {
      margin-top: 25px;
      font-size: 18px;
      min-height: 30px;
    }

    .loading {
      color: #ffd700;
      animation: blink 1s infinite;
    }

    .success {
      color: #00ffcc;
    }

    .error {
      color: #ff6b6b;
    }

    .footer {
      margin-top: 30px;
      font-size: 12px;
      opacity: 0.7;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes blink {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🚀 Full Stack App</h1>
    <p class="subtitle">Click the button to fetch live server time ⏱️</p>

    <button onclick="getData()">Get Server Time</button>

    <p id="output"></p>

    <div class="footer">
      ⚙️ Powered by Node.js • Docker • CI/CD • Monitoring
    </div>
  </div>

  <script>
    async function getData() {
      const output = document.getElementById("output");

      try {
        output.innerText = "⏳ Fetching data...";
        output.className = "loading";

        const res = await fetch("http://backend:5000");

        if (!res.ok) {
          throw new Error("Failed to fetch data");
        }

        const data = await res.json();

        // ✅ FIXED LINE (safe + correct)
        output.innerText = "🕒 Server Time: " + data.time;

        output.className = "success";
      } catch (error) {
        output.innerText = "❌ Error fetching data";
        output.className = "error";
      }
    }
  </script>
</body>
</html>
