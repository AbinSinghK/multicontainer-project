<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>⚡ DevOps Monitoring Dashboard</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background: radial-gradient(circle at top, #1e3c72, #2a5298);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .dashboard {
      width: 420px;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.5);
      animation: pop 0.6s ease;
    }

    @keyframes pop {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .tag {
      text-align: center;
      font-size: 12px;
      opacity: 0.8;
      margin-bottom: 20px;
    }

    .card {
      background: rgba(255,255,255,0.08);
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .status {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: gray;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%,100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(to right, #00c6ff, #0072ff);
      color: white;
      font-size: 15px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.03);
    }

    .output {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: rgba(255,255,255,0.08);
      font-size: 14px;
      min-height: 40px;
    }

    .success { color: #00ffcc; }
    .error { color: #ff6b6b; }
    .loading { color: #ffd700; }
  </style>
</head>

<body>

<div class="dashboard">

  <h1>⚡ DevOps Dashboard</h1>
  <div class="tag">Live Backend Monitoring Panel</div>

  <div class="card status">
    <div>Backend API</div>
    <div class="dot"></div>
  </div>

  <button onclick="getData()">▶ Test API (Get Server Time)</button>

  <div id="output" class="output">Waiting for request...</div>

</div>

<script>
async function getData() {
  const output = document.getElementById("output");

  try {
    output.innerText = "⏳ Calling backend API...";
    output.className = "output loading";

    const res = await fetch("http://localhost:5000");

    if (!res.ok) throw new Error("API failed");

    const data = await res.json();

    const time = new Date(data.time).toLocaleString();

    output.innerHTML =
      "🟢 <b>Success!</b><br>⏱ Server Time: " + time;

    output.className = "output success";

  } catch (err) {
    output.innerHTML =
      "🔴 <b>Backend not reachable</b><br>Check Docker / API / CORS";

    output.className = "output error";
  }
}
</script>

</body>
</html>
