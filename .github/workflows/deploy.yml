name: Multi-Container Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_IP }}
          username: abinsingh2016
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/multicontainer-project || git clone https://github.com/AbinSinghK/multicontainer-project.git && cd multicontainer-project
            git pull
            docker compose down
            docker compose up --build -d